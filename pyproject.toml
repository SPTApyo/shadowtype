[project]
name = "shadowtype"
version = "0.0.1"
description = "Turn any text into a shadowed ASCII banner, as .txt and gradient .svg"
readme = "README.md"
license = "MIT"
authors = [{ name = "SPTApyo" }]
requires-python = ">=3.10"
dependencies = ["pyfiglet>=1.0", "pillow>=10.1"]

[project.urls]
Repository = "https://github.com/SPTApyo/shadowtype"

[project.scripts]
shadowtype = "shadowtype:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["shadowtype.py"]

[tool.ruff]
line-length = 120
